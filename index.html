<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14307F">
<title>Hachi Translator</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F2F5FA;--surface:#fff;--surface-2:#E9EEF7;--ink:#0E1730;--muted:#55617D;--line:#D6DEEE;--primary:#1B3D9C;--on:#fff;--soft:#E3EAFE;--hdr:#14307F;--ok:#13785A;--ok-soft:#DDF3EA;--warn:#9A4F00;--warn-soft:#FFEAD0;--danger:#B3261E;
--ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--ar:"Noto Naskh Arabic","Geeza Pro","Segoe UI","Traditional Arabic",Tahoma,Arial,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0A1124;--surface:#121B37;--surface-2:#1A2446;--ink:#E8EDFF;--muted:#9AA7C9;--line:#26315A;--primary:#93ADFF;--on:#0A1124;--soft:#1C2A5C;--hdr:#0F1838;--ok:#52D1A4;--ok-soft:#0F3328;--warn:#FFB36B;--warn-soft:#3C2812;--danger:#FF8A80;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--ui);padding-top:env(safe-area-inset-top,0)}
button,textarea{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}[hidden]{display:none!important}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:plaintext}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{background:var(--hdr);color:#fff;position:sticky;top:0;z-index:5}
.hin{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left)) 10px max(16px,env(safe-area-inset-right))}
.mark{font:700 28px/1 var(--ar);direction:rtl}.nm{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;font-weight:650}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:99px;padding:6px 12px;font-size:12.5px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:#FFB454}.chip.ready i{background:#4ADE9B}.chip.err i{background:#FF6B6B}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:inherit;display:grid;place-items:center}
header .ib:hover{background:rgba(255,255,255,.14)}
main{max-width:1000px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:12px}
.dir{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.lang{padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:650;text-align:center}
.lang.on{border-color:var(--primary);color:var(--primary)}
.swap{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--primary);display:grid;place-items:center}
.panes{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:860px){.panes{grid-template-columns:1fr 1fr}.pane{min-height:260px}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:170px}
.pane.o{background:var(--soft);border-color:transparent}
textarea{flex:1;width:100%;border:0;background:transparent;resize:none;outline:none;font-size:22px;line-height:1.45;min-height:110px;padding:0}
textarea.ar{font-size:26px;line-height:1.7;text-align:right}
.out{flex:1;font-size:26px;line-height:1.45;word-break:break-word;white-space:pre-wrap;min-height:70px}
.out.ar{font-size:32px;line-height:1.75;text-align:right}
.out.busy{opacity:.55}.out.ph{color:var(--muted);font-size:18px}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.btn.sq{width:40px;padding:0;justify-content:center}.btn.pri{background:var(--primary);color:var(--on);border-color:transparent}
.btn.live{background:var(--danger);color:#fff;border-color:transparent}
.tag{font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--surface);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sw input{width:38px;height:22px;appearance:none;background:var(--line);border-radius:99px;position:relative;transition:.2s}
.sw input::after{content:"";position:absolute;inset:3px auto 3px 3px;width:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked{background:var(--primary)}.sw input:checked::after{transform:translateX(16px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:17px}.card p{margin:0;color:var(--muted);font-size:14.5px}
.bar{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,10,25,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0}.sheet p,.sheet li{font-size:14px;color:var(--muted);margin:0}.sheet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.show{position:fixed;inset:0;z-index:30;background:var(--hdr);color:#fff;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}
.show div{font-size:clamp(36px,11vw,84px);line-height:1.5;font-weight:650;word-break:break-word}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:92vw;text-align:center}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips .chip{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:14px;padding:7px 12px}
.chips .chip.ar{font-size:17px}
.chip{cursor:pointer}
.note{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.note.info{background:var(--surface);color:var(--muted)}
.note .chips .chip{font-size:13px;padding:4px 10px}
.f{display:flex;flex-direction:column;gap:6px}.f label{font-size:13px;font-weight:600}
.f input,.f textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);outline:none;width:100%;font-size:17px;min-height:0}
.f textarea{min-height:80px;flex:none}
pre.diag{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--surface-2);padding:12px;border-radius:12px;margin:0;color:var(--ink)}
.sheet h4{margin:6px 0 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M5 11a7 7 0 0 0 14 0 M12 18v3"/></symbol>
<symbol id="i-spk" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z M16.5 8.5a5 5 0 0 1 0 7 M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 9h11v11H9z M5 15V4h11"/></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 7h12 M16 4l3 3-3 3 M17 17H5 M8 14l-3 3 3 3"/></symbol>
<symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5 M20 9V4h-5 M4 15v5h5 M20 15v5h-5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12 M18 6L6 18"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01 M12 12h.01 M19 12h.01" stroke-width="3"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
</defs></svg>
<header><div class="hin"><span class="mark" lang="ar">حچي</span><span class="nm">Hachi</span><span class="sp"></span>
<button class="chip" id="installBtn" hidden>Install app</button>
<button class="chip" id="status" aria-live="polite"><i></i><span id="stTxt">Offline · ready</span></button>
<button class="ib" id="menu" aria-label="Menu"><svg class="ico"><use href="#i-more"/></svg></button></div></header>
<main>
  <div class="dir"><div class="lang on" id="lA">English</div><button class="swap" id="swap" aria-label="Swap languages"><svg class="ico"><use href="#i-swap"/></svg></button><div class="lang ar" id="lB">العراقي</div></div>
  <div class="panes">
    <section class="pane">
      <textarea id="inp" rows="3" autocomplete="off" spellcheck="false" aria-label="Text to translate"></textarea>
      <div class="tools"><button class="btn sq" id="mic" aria-label="Speak"><svg class="ico"><use href="#i-mic"/></svg></button><button class="btn sq" id="clr" aria-label="Clear" hidden><svg class="ico"><use href="#i-x"/></svg></button></div>
    </section>
    <section class="pane o">
      <div class="out ph" id="out" aria-live="polite">Translation appears here.</div>
      <div class="tools"><span class="tag" id="tag" hidden></span><span class="sp"></span><label class="sw" id="flv"><input type="checkbox" id="flavour" checked>Iraqi touch</label></div>
      <div id="note"></div>
      <div class="tools"><button class="btn" id="play"><svg class="ico"><use href="#i-spk"/></svg>Play</button><button class="btn" id="copy"><svg class="ico"><use href="#i-copy"/></svg>Copy</button><button class="btn" id="show"><svg class="ico"><use href="#i-full"/></svg>Show</button><button class="btn" id="fix"><svg class="ico"><use href="#i-edit"/></svg>Fix</button></div>
    </section>
  </div>
  <section class="card" id="setup" hidden><h2 id="suT"></h2><p id="suP"></p><div class="bar" id="bar" hidden><i id="barI"></i></div><div class="tools"><button class="btn pri" id="dl"></button><button class="btn" id="dlNo">Not now</button></div></section>
  <section class="card" id="tips"><h2>Try these</h2><div class="chips" id="ex"></div></section>
</main>
<div id="layer"></div><div id="toastBox"></div>
<script src="data.js"></script><script src="data2.js"></script><script src="engine.js"></script>
<script src="app.js"></script></body></html>
